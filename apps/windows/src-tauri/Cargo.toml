[package]
name = "hazcom-navigator"
version = "0.1.0"
description = "HazCom Navigator Windows authoring client"
authors = ["SaturnStraw"]
edition = "2021"

[lib]
name = "hazcom_navigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9.3"

axum = "0.8"
tokio = { version = "1", features = ["net", "time", "sync", "macros"] }
rand = "0.9"
tauri-plugin-opener = "2"

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
sha2 = "0.10"
lopdf = { version = "0.38", default-features = false }
windows = { version = "0.61.3", features = ["Data_Pdf", "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Security_Cryptography", "Security_Cryptography_DataProtection"] }
windows-future = "0.2.1"

[dev-dependencies]
font8x8 = "0.3"
tower = { version = "0.5", features = ["util"] }
