[package]
name = "hazcom-navigator"
version = "0.1.0"
description = "HazCom Navigator Windows authoring client"
authors = ["SaturnStraw"]
edition = "2021"

[lib]
name = "hazcom_navigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = "0.8"
tokio = { version = "1", features = ["net", "time", "sync", "macros"] }
rand = "0.9"
tauri-plugin-opener = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
